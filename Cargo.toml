[package]
name = "basti-on"
version = "0.1.0"
edition = "2021"
description = "Basti-on: a Rust validation airlock that stands guard in front of a memory-unsafe C++ DNS parser"
license = "MIT"

[lib]
name = "bastion"
crate-type = ["lib", "staticlib"]

[dependencies]
cxx = "1.0"

[build-dependencies]
cxx-build = "1.0"

[dev-dependencies]
# nothing yet; fuzzing lives in the fuzz/ sub-crate

[profile.release]
debug = true  # keep symbols so fuzzer/benchmark stack traces are readable
